<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Cat Chat</title>
    <link rel="icon" href="/favicon.ico?v=__V__">
    <link rel="stylesheet" href="css/tokens.css?v=__V__">
    <link rel="stylesheet" href="css/chat.css?v=__V__">
</head>
<body>
    <!-- ═══ 顶部栏 ═══ -->
    <div id="chatbar">
        <span class="sid" id="chatTitle">—</span>
        <span id="chatInfo">—</span>
        <span style="flex:1"></span>
        <span id="uiVer" data-version title="前端版本——每次 Vitest 自动递增 + 最后更新时间">UI v?</span>
        <button id="chatNew" title="新会话（session.new——清前文并重新注入）">新会话</button>
        <button id="chatRefresh" title="刷新——重建界面气泡（纯前端）">刷新</button>
    </div>

    <!-- ═══ 持久区——对话区（契约 §12.2 ②：每块对应一个气泡渲染函数） ═══ -->
    <div id="chatMsgs"></div>
    <!-- 自绘滚动带（js/chat/fx/scroll.js · design-ch4-frontend-scroll）——IDE 风格滚动带：视口指示块 + 消息刻度 + 点击跳转 + 拖拽；
         原生滚动条已隐藏；几何由 JS 按对话区矩形同步 -->
    <div id="chatScrollBand"><div id="sbScopes"></div><div id="sbThumb"></div><div id="sbTicks"></div></div>

    <!-- 核心对话显隐开关（2026-10-11 莎定）——左预留带顶部（与输入区切换开关同款竖向滑块）；默认全显示（F5 重建即复位）；
         切「精简」→ #chatMsgs 加 .core-only → 隐藏非 user / text 行（只留核心对话）；滚动带随类变化自动重算 -->
    <div id="chatCoreToggle" class="ch-livetoggle ch-lt-top" title="切换：全显示 / 只留核心对话（隐藏思考 · 工具 · 结算等）">
        <span class="ch-lt-thumb"></span>
        <span class="ch-lt-label" id="chatCoreLabel">全部</span>
    </div>

    <!-- ═══ 插话队列显示区（js/chat/state/pending.js——内核 _pending 队列投影；含 QQ / 指令 / 定时等非前端来源；空表自动隐藏） ═══ -->
    <div id="chatPendingPanel"></div>

    <!-- ═══ 输入区 ═══ -->
    <div id="chatinput" data-live="empty">
        <!-- Note / 定时 / 跳底 按钮行（绝对定位贴输入区上缘；Note 面板 note.js · 定时面板 delay.js · 跳底在 main.js） -->
        <div id="noteWrap" class="note-wrap">
            <div id="notePopover" class="note-popover" style="display:none">
                <div class="note-popover-head"><span id="noteTitle">Note</span></div>
                <div id="noteList"></div>
                <div id="noteAddRow">
                    <input id="noteAddInput" placeholder="新增任务…（Enter 提交）">
                    <button id="noteAddBtn">＋</button>
                    <button id="noteStartBtn" title="把 Note 计划拼接进度推给 LLM 开始执行">开始 Note</button>
                </div>
            </div>
            <div id="noteBubble" class="note-bubble" title="Note 工作进度——点击展开/收起">
                <span id="noteBubbleText">Note · 空</span>
            </div>
            <!-- 延迟指令队列（design-ch4-delay §六）——定时按钮 + 弹层（delay.js） -->
            <div id="delayWrap" class="delay-wrap">
                <button id="delayBtn" title="定时指令队列——延迟注入 / 改时刻 / 取消">定时<span id="delayCount"></span></button>
                <div id="delayPopover" class="delay-popover" style="display:none">
                    <div class="delay-popover-head"><span id="delayTitle">定时指令队列</span></div>
                    <div class="delay-sec delay-sec-list">
                        <div class="delay-sec-head">待触发<span id="delaySecCount"></span></div>
                        <div id="delayList"></div>
                    </div>
                    <div class="delay-sec delay-sec-add">
                        <div class="delay-sec-head">插入指令</div>
                        <div id="delayQuickRow"></div>
                        <div id="delayCustomRow" style="display:none">
                            <input type="datetime-local" id="delayCustomAt" step="1">
                        </div>
                        <div id="delayAddRow">
                            <input id="delayText" placeholder="注入内容…（Enter 提交）">
                            <label id="delayLoopLabel" title="循环——每次触发后按相同时长重排（不自动移除）"><input type="checkbox" id="delayLoop">循环</label>
                            <button id="delayAddBtn" title="按选中档位新建（或 Enter 提交）">＋</button>
                        </div>
                    </div>
                </div>
            </div>
            <button id="chatJumpBottom" title="跳到最下层（回到最新内容）">↓</button>
        </div>

        <div id="chatImages" class="chat-images"></div>
        <textarea id="chatSendInput" rows="5" placeholder="输入文本…（Enter 发送；Shift+Enter 换行；可直接粘贴图片）"></textarea>
        <!-- 临时区切换开关（2026-10-06 莎定：按钮 → 竖向滑块；同日合并为单按钮）——输入框左侧左预留带内，
             滑块随当前态上下移动：输入态色 = 输入区主色蓝；流式态色 = 统一态色 `--ch-live-color`
             （挂 `#chatinput` 的 `data-live` 上，由 live.js 写入，映射归 chat.css 令牌——
             thinksse 黄 / toolrun 军绿 / replysse 米白 / empty 灰；与临时区气泡描边同源）。
             单标签随态上下移动并改字（输入 / 流式）——点击整体翻转。
             面板高度 = 输入框实测高度（固定）——由 input.js 切换时写入，空态亦保持同高） -->
        <!-- 流式统计行（fx/live-stats.js · 契约 §12.8 独立功能面）——切换开关正上方灰色三行读数
             （line 行数 / char 字符数 / time 段用时）；无活跃流式段即隐藏（不占位）；内容向左展开（左预留带内） -->
        <div id="chatLiveStats"></div>
        <div id="chatLiveToggle" class="ch-livetoggle" title="切换：输入区 / 流式区（进行中的思考 · 工具 · 回复流）">
            <span class="ch-lt-thumb"></span>
            <span class="ch-lt-label" id="chatLiveLabel">输入</span>
        </div>
        <!-- 临时区（契约 §12.2 ③）——与输入框**同区域互斥**（同一列同位，代码切内联 display）：
             显示时输入框让位、状态投影整体替换；高度固定 = 输入框实测高（空态亦同高）；回车发送自动切回输入态 -->
        <div id="chatLivePanel" class="chat-live" style="display:none"></div>
        <!-- 输入区动作列——停止 / 继续 / 发送（竖排同列、同款实心；底色区分语义） -->
        <div id="chatActions">
            <button id="chatPause" class="ch-iabtn ch-iabtn-stop" title="停止本轮（cat.pause——已生成内容保留，前文格式修复）" disabled>停止</button>
            <button id="chatContinue" class="ch-iabtn ch-iabtn-continue" title="继续——用当前前文直接发一次 LLM 请求（cat.continue：不追加消息，模型续写）" disabled>继续</button>
            <button id="chatSendBtn" class="ch-iabtn ch-iabtn-send">发送</button>
        </div>
    </div>

    <!-- ═══ 状态区——六态计时（契约 §12.2 ① state 段投影） ═══ -->
    <div id="chatStatus"></div>
    <!-- 桌宠（纯前端渲染——js/chat/fx/pet.js；素材清单 js/pet-manifest.js） -->
    <div id="chatPet"><img id="chatPetImgA" alt="桌宠"><img id="chatPetImgB" alt=""></div>

    <!-- ═══════════════════════════════════════════
         脚本清单——加载顺序即依赖顺序：
           ① 公共件（两页共用）→ ② 素材 lib → ③ 素材 blocks → ④ 主干 → ⑤ 面板 / 侧翼 → ⑥ 独立功能 fx
         素材与主干的边界：素材零全局状态（返回元素即完）；挂载 / 排序 / 跟随 / 指令归主干。
         函数声明在脚本加载时即注册全局，故跨件引用按运行时解析——
         硬顺序两处：③ 先于 ④（registry.js 顶层把 blocks 的函数引用收进映射表）；
                     ⑥ 段末 registry.js 在其各件之后（fx 表持有入口名），fxBoot 由引导层调用。
         ═══════════════════════════════════════════ -->
    <script src="js/ui-common.js?v=__V__"></script>
    <!-- 桌宠素材清单（生成物——`WorkSpace/pet/convert_pet.py` 产出；A171 桌宠渲染用） -->
    <script src="js/pet-manifest.js?v=__V__"></script>

    <!-- ② 素材 lib——块渲染共用件（DOM 构造 / 格式化 / MD / 图片 / 按压判据 / 思考头行 / 工具骨架） -->
    <script src="js/chat/lib/dom.js?v=__V__"></script>
    <script src="js/chat/lib/format.js?v=__V__"></script>
    <script src="js/chat/lib/press.js?v=__V__"></script>
    <script src="js/chat/lib/md.js?v=__V__"></script>
    <script src="js/chat/lib/md-copy.js?v=__V__"></script>
    <script src="js/chat/lib/images.js?v=__V__"></script>
    <script src="js/chat/lib/tool-format.js?v=__V__"></script>
    <script src="js/chat/lib/fallback.js?v=__V__"></script>
    <script src="js/chat/lib/cmd.js?v=__V__"></script>

    <!-- ②b 工具声明层——逐工具一件（按工具组分子目录）+ 基建两件（A200 恢复）
         顺序：基建（decl 注册口 / helpers 取用小件）→ 各件（件底一行 toolDecl(name, {…}) 自注册） -->
    <script src="js/chat/tools/decl.js?v=__V__"></script>
    <script src="js/chat/tools/helpers.js?v=__V__"></script>
    <!-- TextCat（7） -->
    <script src="js/chat/tools/text/text-read.js?v=__V__"></script>
    <script src="js/chat/tools/text/text-read_lines.js?v=__V__"></script>
    <script src="js/chat/tools/text/text-read_between.js?v=__V__"></script>
    <script src="js/chat/tools/text/text-write.js?v=__V__"></script>
    <script src="js/chat/tools/text/text-append.js?v=__V__"></script>
    <script src="js/chat/tools/text/text-replace.js?v=__V__"></script>
    <script src="js/chat/tools/text/text-grep.js?v=__V__"></script>
    <!-- FileCat（6） -->
    <script src="js/chat/tools/file/file-tree.js?v=__V__"></script>
    <script src="js/chat/tools/file/file-find.js?v=__V__"></script>
    <script src="js/chat/tools/file/file-move.js?v=__V__"></script>
    <script src="js/chat/tools/file/file-delete.js?v=__V__"></script>
    <script src="js/chat/tools/file/file-copy.js?v=__V__"></script>
    <script src="js/chat/tools/file/file-version.js?v=__V__"></script>
    <!-- CsCat（13） -->
    <script src="js/chat/tools/cs/cs-check.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-build.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-list.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-read.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-find_ref.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-find.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-patch.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-member.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-comment.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-dead.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-comment_check.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-format.js?v=__V__"></script>
    <script src="js/chat/tools/cs/cs-test.js?v=__V__"></script>
    <!-- MauCat（4） -->
    <script src="js/chat/tools/mau/mau-verify.js?v=__V__"></script>
    <script src="js/chat/tools/mau/mau-gen.js?v=__V__"></script>
    <script src="js/chat/tools/mau/mau-proj.js?v=__V__"></script>
    <script src="js/chat/tools/mau/mau-setup.js?v=__V__"></script>
    <!-- ConfigCat（6） -->
    <script src="js/chat/tools/config/config-list.js?v=__V__"></script>
    <script src="js/chat/tools/config/config-get.js?v=__V__"></script>
    <script src="js/chat/tools/config/config-set.js?v=__V__"></script>
    <script src="js/chat/tools/config/config-reset.js?v=__V__"></script>
    <script src="js/chat/tools/config/config-cat-get.js?v=__V__"></script>
    <script src="js/chat/tools/config/config-cat-set.js?v=__V__"></script>
    <!-- BrowserCat（6） -->
    <script src="js/chat/tools/browser/browser-open.js?v=__V__"></script>
    <script src="js/chat/tools/browser/browser-read.js?v=__V__"></script>
    <script src="js/chat/tools/browser/browser-eval.js?v=__V__"></script>
    <script src="js/chat/tools/browser/browser-shot.js?v=__V__"></script>
    <script src="js/chat/tools/browser/browser-tabs.js?v=__V__"></script>
    <script src="js/chat/tools/browser/browser-headful.js?v=__V__"></script>
    <!-- PsCat（2） -->
    <script src="js/chat/tools/ps/powershell.js?v=__V__"></script>
    <script src="js/chat/tools/ps/powershell7.js?v=__V__"></script>
    <!-- TempToolCat（2） -->
    <script src="js/chat/tools/temp/temp-info.js?v=__V__"></script>
    <script src="js/chat/tools/temp/temp-exec.js?v=__V__"></script>
    <!-- Majordomo（5） -->
    <script src="js/chat/tools/majordomo/restart-full.js?v=__V__"></script>
    <script src="js/chat/tools/majordomo/restart-incr.js?v=__V__"></script>
    <script src="js/chat/tools/majordomo/restart-host.js?v=__V__"></script>
    <script src="js/chat/tools/majordomo/majordomo-cmd.js?v=__V__"></script>
    <script src="js/chat/tools/majordomo/majordomo-catinfo.js?v=__V__"></script>
    <!-- SearchCat（2）· VisionCat（2） -->
    <script src="js/chat/tools/search/web-search.js?v=__V__"></script>
    <script src="js/chat/tools/search/web-ds-search.js?v=__V__"></script>
    <script src="js/chat/tools/vision/image-analyze.js?v=__V__"></script>
    <script src="js/chat/tools/vision/image-inject.js?v=__V__"></script>
    <!-- AudioCat（2） · PyCat（3） · WebCat 增补（2） -->
    <script src="js/chat/tools/audio/audio-play.js?v=__V__"></script>
    <script src="js/chat/tools/audio/audio-speak.js?v=__V__"></script>
    <script src="js/chat/tools/py/py-run.js?v=__V__"></script>
    <script src="js/chat/tools/py/py-list.js?v=__V__"></script>
    <script src="js/chat/tools/py/py-service.js?v=__V__"></script>
    <script src="js/chat/tools/search/web-fetch.js?v=__V__"></script>
    <script src="js/chat/tools/search/web-fetch-jobs.js?v=__V__"></script>
    <!-- DbCat（5） -->
    <script src="js/chat/tools/db/db-put.js?v=__V__"></script>
    <script src="js/chat/tools/db/db-query.js?v=__V__"></script>
    <script src="js/chat/tools/db/db-get.js?v=__V__"></script>
    <script src="js/chat/tools/db/db-update.js?v=__V__"></script>
    <script src="js/chat/tools/db/db-delete.js?v=__V__"></script>
    <!-- DbAdmin（3） -->
    <script src="js/chat/tools/dbadmin/dbAdmin-libs.js?v=__V__"></script>
    <script src="js/chat/tools/dbadmin/dbAdmin-create.js?v=__V__"></script>
    <script src="js/chat/tools/dbadmin/dbAdmin-drop.js?v=__V__"></script>
    <!-- 内置（10） -->
    <script src="js/chat/tools/builtin/info.js?v=__V__"></script>
    <script src="js/chat/tools/builtin/Note.js?v=__V__"></script>
    <script src="js/chat/tools/builtin/time.js?v=__V__"></script>
    <script src="js/chat/tools/builtin/random.js?v=__V__"></script>
    <script src="js/chat/tools/builtin/pack.js?v=__V__"></script>
    <script src="js/chat/tools/builtin/host-reload.js?v=__V__"></script>
    <script src="js/chat/tools/builtin/host-flows.js?v=__V__"></script>
    <script src="js/chat/tools/builtin/sleep.js?v=__V__"></script>
    <script src="js/chat/tools/builtin/timer.js?v=__V__"></script>
    <script src="js/chat/tools/builtin/timeback.js?v=__V__"></script>

    <!-- ③ 素材 blocks——渲染件 12 件（persist 10 + live 2；`toolrun` 复用工具卡件 · `empty` 不产元素） -->
    <script src="js/chat/blocks/user.js?v=__V__"></script>
    <script src="js/chat/blocks/systemautomessage.js?v=__V__"></script>
    <script src="js/chat/blocks/text.js?v=__V__"></script>
    <script src="js/chat/blocks/reason.js?v=__V__"></script>
    <script src="js/chat/blocks/toolcard.js?v=__V__"></script>
    <script src="js/chat/blocks/retry.js?v=__V__"></script>
    <script src="js/chat/blocks/error.js?v=__V__"></script>
    <script src="js/chat/blocks/inject-report.js?v=__V__"></script>
    <script src="js/chat/blocks/roundsum.js?v=__V__"></script>
    <script src="js/chat/blocks/roundsummary.js?v=__V__"></script>
    <script src="js/chat/blocks/reply-sse.js?v=__V__"></script>
    <script src="js/chat/blocks/think-sse.js?v=__V__"></script>

    <!-- ③b state 投影——各投影件（每件一个输出面）+ 分发表（表持入口名，置于段末） -->
    <script src="js/chat/state/status.js?v=__V__"></script>
    <script src="js/chat/state/info.js?v=__V__"></script>
    <script src="js/chat/state/note.js?v=__V__"></script>
    <script src="js/chat/state/delay.js?v=__V__"></script>
    <script src="js/chat/state/pending.js?v=__V__"></script>
    <script src="js/chat/state/conn.js?v=__V__"></script>
    <script src="js/chat/state/meta.js?v=__V__"></script>
    <script src="js/chat/state/registry.js?v=__V__"></script>

    <!-- ④ 主干——映射表 → 流式呈现机制 → 两区入口 → 状态投影 → 单一应用入口 -->
    <script src="js/chat/registry.js?v=__V__"></script>
    <script src="js/chat/stream.js?v=__V__"></script>
    <script src="js/chat/persist.js?v=__V__"></script>
    <script src="js/chat/live.js?v=__V__"></script>
    <script src="js/chat/state.js?v=__V__"></script>
    <script src="js/chat/main.js?v=__V__"></script>
    <script src="js/chat/input.js?v=__V__"></script>

    <!-- ⑤ 面板与侧翼（主干层）——note / delay 面板 · paste 出口面 -->
    <script src="js/chat/note.js?v=__V__"></script>
    <script src="js/chat/delay.js?v=__V__"></script>
    <script src="js/chat/paste.js?v=__V__"></script>

    <!-- ⑥ 独立功能（fx）——每功能一件 · registry.js 在段末（表持有各件入口名）；启动由引导层 fxBoot() 统一执行 -->
    <script src="js/chat/fx/pet.js?v=__V__"></script>
    <script src="js/chat/fx/scroll.js?v=__V__"></script>
    <script src="js/chat/fx/cmd-intent.js?v=__V__"></script>
    <script src="js/chat/fx/controls.js?v=__V__"></script>
    <script src="js/chat/fx/live-stats.js?v=__V__"></script>
    <script src="js/chat/fx/registry.js?v=__V__"></script>

    <script>
        // 引导层——只做接线与启动，不含业务逻辑
        loadUiVersion();
        loadUiConfig();
        chatBoot();
        fxBoot();
    </script>
</body>
</html>
