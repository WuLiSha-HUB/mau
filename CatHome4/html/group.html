<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CH4 群聊</title>
    <link rel="icon" href="/favicon.ico?v=__V__">
    <link rel="stylesheet" href="css/tokens.css?v=__V__">
    <link rel="stylesheet" href="css/chat.css?v=__V__">
    <style>
        /* 群聊页专属补充（A311）——布局 / 气泡 / MD 全部复用 chat.css，本段只补对话页没有的三处：
           ① @ 目标行（与内容列同左缘）② 消息首行 meta（来源 / 类型 / 目标）③ 空态与尾部提示 */
        .group-from-row { display: grid; grid-template-columns: var(--ch-col-left) var(--ch-col-w) 1fr; align-items: center; padding: 4px 0; }
        .group-at-box { grid-column: 2; display: flex; align-items: center; gap: 6px; min-width: 0; }
        .group-at { color: var(--ch-fg-weak); font-size: var(--ch-fs-tag); }
        #toSel { flex: 1; min-width: 0; background: var(--ch-bg-panel); border: 1px solid var(--ch-line); border-radius: 4px; color: var(--ch-fg); padding: 4px 8px; font-family: inherit; font-size: var(--ch-fs-tag); }
        #toSel:focus { outline: none; border-color: var(--ch-focus); }
        #groupMsg { grid-column: 3; margin-left: 8px; color: var(--ch-fg-weak); font-size: var(--ch-fs-tag); }
        /* 消息首行——略大字号描述来源类型与目标（A311 莎定）；时间靠右弱化 */
        .msg-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; font-size: var(--ch-fs-strong); color: var(--ch-fg-muted); white-space: normal; word-break: break-all; }
        .msg-meta .mm-kind { color: var(--ch-chat-ai-fg); }
        .msg-meta .mm-who { color: var(--ch-identity); }
        .msg-meta .mm-target { color: var(--ch-state-run); }
        .msg-meta .mm-refs { color: var(--ch-state-all); }
        .msg-meta .mm-seq { color: var(--ch-fg-faint); font-size: var(--ch-fs-tag); }
        .msg-meta .mm-time { margin-left: auto; color: var(--ch-fg-weak); font-size: var(--ch-fs-tag); }
        /* A313 消息操作——发送方名字可点（@ 快捷填入）；单条复制按钮（图标复用 md-copy 的线条双框） */
        .msg-meta .mm-who-pick { cursor: pointer; }
        .msg-meta .mm-who-pick:hover { text-decoration: underline; }
        .msg-meta .msg-copy-btn { background: none; border: none; cursor: pointer; color: var(--ch-fg-muted); line-height: 0; padding: 2px; border-radius: 4px; opacity: 0.35; transition: opacity 0.15s; }
        .chat-bubble:hover .msg-meta .msg-copy-btn { opacity: 1; }
        .msg-meta .msg-copy-btn:hover { background: var(--ch-hover-overlay); color: var(--ch-fg-strong); }
        .msg-meta .msg-copy-btn svg { display: block; }
        .msg-meta .msg-copy-btn.done svg { display: none; }
        .msg-meta .msg-copy-btn.done::after { content: '✓'; font-size: var(--ch-fs-tag); line-height: 1; }
        .chat-row.user .msg-meta .msg-copy-btn { color: var(--ch-chat-user-fg); opacity: 0.6; }
        /* 人（user 泡）内首行字色——深底上按反色系走 */
        .chat-row.user .msg-meta { color: var(--ch-chat-user-fg); }
        .chat-row.user .msg-meta .mm-kind,
        .chat-row.user .msg-meta .mm-who,
        .chat-row.user .msg-meta .mm-target,
        .chat-row.user .msg-meta .mm-refs { color: var(--ch-chat-user-fg); }
        .chat-row.user .msg-meta .mm-seq,
        .chat-row.user .msg-meta .mm-time { color: var(--ch-chat-user-fg); opacity: 0.75; }
        .group-empty { color: var(--ch-fg-weak); padding: 0 12px; }
        /* 清空动作——勾选确认后才可用（危险动作防误触） */
        #chatClearWrap { display: flex; align-items: center; gap: 4px; color: var(--ch-fg-weak); font-size: var(--ch-fs-tag); }
        #chatClearConfirm { cursor: pointer; }
        #chatClear { background: var(--ch-bg-raised); border: 1px solid var(--ch-line); color: var(--ch-fg-muted); padding: 3px 10px; cursor: pointer; font-family: inherit; font-size: var(--ch-fs-tag); border-radius: 4px; }
        #chatClear:disabled { opacity: 0.45; cursor: not-allowed; }
        /* ═══ A319 成员球列——左预留带内竖列（与对话页「全部/精简」开关同一条竖轴：左缘 / 宽 = --ch-send-w）═══
           构成：主题色球（猫名首字 · 管理员球顶挂 👑）+ 右下状态灯点（六态同源色）+ 下方前文 token
           top / max-height 由 group.js 按对话区矩形写入（fixed，不随对话滚动） */
        #groupCats { position: fixed; left: calc(var(--ch-col-left) - var(--ch-send-w) - 6px); top: 0; width: var(--ch-send-w); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; overflow-y: auto; scrollbar-width: none; z-index: 6; }
        #groupCats::-webkit-scrollbar { width: 0; height: 0; }
        .gc-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 0 0 auto; }
        .gc-crown { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); z-index: 2; font-size: 11px; line-height: 1; pointer-events: none; filter: drop-shadow(0 0 2px var(--ch-shadow-strong)); }
        .gc-ball { position: relative; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: var(--ch-bg-page); background: var(--gc-color, var(--ch-fg-inverse)); box-shadow: 0 0 0 1px var(--ch-line); }
        .gc-item.off .gc-ball { opacity: 0.35; }
        .gc-dot { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ch-bg-page); background: var(--ch-fg-faint); }
        .gc-dot.link { background: var(--ch-state-link); }
        .gc-dot.wait { background: var(--ch-state-wait); }
        .gc-dot.think { background: var(--ch-state-think); }
        .gc-dot.tool { background: var(--ch-state-tool); }
        .gc-dot.run { background: var(--ch-state-run); }
        .gc-dot.reply { background: var(--ch-state-reply); }
        .gc-item.busy .gc-dot { animation: chat-phase-pulse 1.8s ease-in-out infinite; }
        .gc-name { font-size: 11px; color: var(--ch-fg-weak); max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gc-item.off .gc-name { color: var(--ch-fg-faint); }
        .gc-name .gc-admin { color: var(--ch-warn); }
        .gc-tok { font-size: 10px; color: var(--ch-fg-faint); }
        /* ═══ A320 猫主题色——气泡**只染描边**（底色保持 --ch-chat-ai-bg）；右侧滚动带刻度同取主题色 ═══ */
        #chatMsgs .chat-row.assistant .chat-bubble { --bubble-line: var(--gc-color, var(--ch-bubble-line-text)); }
        /* 刻度——scroll.js 在段首行带 --gc-color 时复制该变量并挂 gc-tint（无主题色的页面不受影响；失败红优先） */
        .sb-tick.gc-tint[data-type]:not(.err) { background: var(--gc-color); }
    </style>
</head>
<body>
    <!-- ═══ 顶部栏（A311 · 与对话页 #chatbar 同构）——左：组名 + 现状简介；右：UI 版本号 + 刷新 ═══ -->
    <div id="chatbar">
        <span class="sid" id="chatTitle">加载中…</span>
        <span id="chatInfo">—</span>
        <span style="flex:1"></span>
        <span id="uiVer" data-version title="前端版本——每次 Vitest 自动递增 + 最后更新时间">UI v?</span>
        <label id="chatClearWrap" title="清空本组消息流——旧流原地归档为 .bak，新流从 #1 起">
            <input type="checkbox" id="chatClearConfirm">确认清空
        </label>
        <button id="chatClear" disabled>清空</button>
        <button id="chatRefresh" title="刷新——重新拉取组信息与消息">刷新</button>
    </div>

    <!-- ═══ 成员球列（A319）——左侧竖排：主题色球 + 猫名首字 + 状态灯点 + 前文 token ═══ -->
    <div id="groupCats" title="组内成员——球色 = 猫主题色；右下点 = 运行态；下方数字 = 前文 token"></div>

    <!-- ═══ 消息区——与对话页同一容器 id（列宽 / gap / 原生滚动条隐藏 / 自绘带几何全部同源） ═══ -->
    <div id="chatMsgs"></div>
    <!-- 自绘滚动带（js/chat/fx/scroll.js 原样复用）——视口指示块 + 消息刻度 + 点击跳转 + 拖拽 -->
    <div id="chatScrollBand"><div id="sbScopes"></div><div id="sbThumb"></div><div id="sbTicks"></div></div>

    <!-- ═══ @ 目标行——与内容列同左缘（端口即组身份，页面不做组切换） ═══ -->
    <div id="groupFromRow" class="group-from-row">
        <div class="group-at-box">
            <span class="group-at">@</span>
            <select id="toSel" title="@ 组内成员——选中按派单投递（回执自动回组）；不选只记流水，由订阅渠道推送"></select>
        </div>
        <span id="groupMsg"></span>
    </div>

    <!-- ═══ 输入区——与对话页 #chatinput 同构（内容列 + 右预留带动作列） ═══ -->
    <div id="chatinput">
        <textarea id="chatSendInput" rows="3" placeholder="输入消息…（Enter 发送；Shift+Enter 换行）"></textarea>
        <div id="chatActions">
            <button id="chatSendBtn" class="ch-iabtn ch-iabtn-send">发送</button>
        </div>
    </div>

    <!-- 脚本顺序即依赖顺序：版本填充 → DOM 小件 → MD 渲染器 → MD 复制 → 滚动带 → 本页逻辑 -->
    <script src="js/ui-common.js?v=__V__"></script>
    <script src="js/chat/lib/dom.js?v=__V__"></script>
    <script src="js/chat/lib/md.js?v=__V__"></script>
    <script src="js/chat/lib/md-copy.js?v=__V__"></script>
    <script src="js/chat/fx/scroll.js?v=__V__"></script>
    <script src="js/group.js?v=__V__"></script>
</body>
</html>
